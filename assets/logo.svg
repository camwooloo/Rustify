    <circle cx="256" cy="256" r="140.0" fill="url(#planet)" />
    <circle cx="256" cy="256" r="140.0" fill="url(#lit)" />
    <circle cx="256" cy="256" r="138.0" fill="none" stroke="url(#edge)" stroke-width="5" />

    <!-- Sound on the planet's face, held upright while the ring stays tilted. -->
    <g transform="rotate(24 256 256)" fill="none" stroke="#1ed760"
       stroke-linecap="round" opacity="0.95">
      <path d="M204 226q52 -27 104 0" stroke-width="17" />
      <path d="M215 259q41 -22 82 0" stroke-width="14.5" />
      <path d="M226 290q30 -16 60 0" stroke-width="12" />
    </g>

