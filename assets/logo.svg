<!-- Rustify's mark: a ringed planet whose ring is a bar visualiser.

     The ring passes behind the planet at the top and in front at the bottom,
     which is what makes it read as Saturn rather than a circle in a hoop.
     Its bars vary just enough to read as levels. The planet keeps a dark
     limb so the lit edge and the ring stay legible at 16px, and wears the
     sound waves on its face. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="planet" cx="36%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#31465c" />
      <stop offset="42%" stop-color="#16202c" />
      <stop offset="100%" stop-color="#070a0f" />
    </radialGradient>

    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ff08e" />
      <stop offset="45%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#0a7d3a" />
    </linearGradient>

    <!-- Light on the side facing the star, gone before the far edge. -->
    <radialGradient id="lit" cx="28%" cy="24%" r="62%">
      <stop offset="0%" stop-color="#5ff08e" stop-opacity="0.9" />
      <stop offset="38%" stop-color="#1ed760" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#1ed760" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="edge" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#7bf6a6" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#1ed760" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1ed760" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <g transform="translate(256 256) scale(1.22) translate(-256 -256) rotate(-24 256 256)">
