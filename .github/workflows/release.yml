# Builds Rustify for Windows, macOS and Linux and attaches one download per
# platform to the release for the tag.
#
# The app ships the daemon and the CLI alongside it as bundle resources, so
# each job builds those first and drops them where the bundler expects, under
# the name that platform uses.

name: Release

on:
  push:
    tags: ["v*"]
  # So the build can be exercised without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others work.
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundle: nsis
            pattern: "*-setup.exe"
          - name: macOS
            os: macos-latest
            bundle: dmg
            pattern: "*.dmg"
          - name: Linux
            os: ubuntu-22.04
            bundle: appimage
            pattern: "*.AppImage"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # webkit2gtk and friends build the window; alsa builds the player.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.os }}

      - name: Build the daemon and the CLI
        run: cargo build --release -p spotify-daemon

      - name: Stage them for the bundler
        shell: bash
        run: |
          mkdir -p app/src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/rustifyd.exe app/src-tauri/binaries/
            cp target/release/rustify-ctl.exe app/src-tauri/binaries/
          else
            cp target/release/rustifyd app/src-tauri/binaries/
            cp target/release/rustify-ctl app/src-tauri/binaries/
            chmod +x app/src-tauri/binaries/rustifyd app/src-tauri/binaries/rustify-ctl
          fi

      - name: Build the app
        run: cargo install tauri-cli --version "^2" --locked && cargo tauri build
        working-directory: app/src-tauri

      - name: Collect the download
        shell: bash
        run: |
          mkdir -p dist
          find target/release/bundle -name "${{ matrix.pattern }}" -type f -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: rustify-${{ matrix.name }}
          path: dist/*

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
