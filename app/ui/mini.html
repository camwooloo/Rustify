<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rustify</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="mini.css" />
  </head>
  <body class="mini">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-play" viewBox="0 0 24 24">
          <path d="M8 5.14v13.72L19 12 8 5.14z" />
        </symbol>
        <symbol id="i-pause" viewBox="0 0 24 24">
          <path d="M7 5h3.5v14H7V5zm6.5 0H17v14h-3.5V5z" />
        </symbol>
        <symbol id="i-prev" viewBox="0 0 16 16">
          <path d="M3.3 1a.7.7 0 0 1 .7.7v5.15L12.5 1.2A.7.7 0 0 1 13.6 1.8v12.4a.7.7 0 0 1-1.1.6L4 9.15V14.3a.7.7 0 0 1-.7.7H2.4a.7.7 0 0 1-.7-.7V1.7a.7.7 0 0 1 .7-.7h.9z" />
        </symbol>
        <symbol id="i-next" viewBox="0 0 16 16">
          <path d="M12.7 1a.7.7 0 0 0-.7.7v5.15L3.5 1.2A.7.7 0 0 0 2.4 1.8v12.4a.7.7 0 0 0 1.1.6L12 9.15V14.3a.7.7 0 0 0 .7.7h.9a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-.9z" />
        </symbol>
        <symbol id="i-heart" viewBox="0 0 16 16">
          <path d="M8 14.25 6.84 13.2C2.72 9.47 0 7.01 0 4.5A3.5 3.5 0 0 1 3.5 1 4.2 4.2 0 0 1 8 3.09 4.2 4.2 0 0 1 12.5 1 3.5 3.5 0 0 1 16 4.5c0 2.51-2.72 4.97-6.84 8.7L8 14.25z" />
        </symbol>
        <symbol id="i-heart-o" viewBox="0 0 16 16">
          <path d="M8 3.09A4.2 4.2 0 0 0 3.5 1 3.5 3.5 0 0 0 0 4.5c0 2.51 2.72 4.97 6.84 8.7L8 14.25l1.16-1.05C13.28 9.47 16 7.01 16 4.5A3.5 3.5 0 0 0 12.5 1 4.2 4.2 0 0 0 8 3.09zm0 9.11-.06-.05C4.1 8.7 1.5 6.34 1.5 4.5A2 2 0 0 1 3.5 2.5c1.15 0 2.2.72 2.6 1.8h1.8c.4-1.08 1.45-1.8 2.6-1.8a2 2 0 0 1 2 2c0 1.84-2.6 4.2-6.44 7.65L8 12.2z" />
        </symbol>
        <symbol id="i-expand" viewBox="0 0 16 16">
          <path d="M2 2h4.5v1.5H3.5V6.5H2V2zm7.5 0H14v4.5h-1.5V3.5H9.5V2zM2 9.5h1.5v3h3V14H2V9.5zm10.5 0H14V14H9.5v-1.5h3v-3z" />
        </symbol>
        <symbol id="i-x" viewBox="0 0 24 24">
          <path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4 6.4 5z" />
        </symbol>
      </defs>
    </svg>

    <!-- The whole window is a drag handle apart from the controls, since it
         has no titlebar of its own. -->
    <div id="mini-art" class="mini-art" data-tauri-drag-region>
      <div class="mini-buttons">
        <button class="mini-btn" id="mini-expand" title="Back to Rustify">
          <svg><use href="#i-expand" /></svg>
        </button>
      </div>
    </div>

    <div class="mini-body">
      <div class="mini-meta" data-tauri-drag-region>
        <div class="mini-name" id="mini-name">Nothing playing</div>
        <div class="mini-artist" id="mini-artist"></div>
      </div>

      <div class="mini-controls">
        <button class="ctl" id="mini-like" title="Save">
          <svg><use href="#i-heart-o" /></svg>
        </button>
        <button class="ctl" id="mini-prev" title="Previous">
          <svg><use href="#i-prev" /></svg>
        </button>
        <button class="ctl ctl-play" id="mini-play" title="Play">
          <svg><use href="#i-play" /></svg>
        </button>
        <button class="ctl" id="mini-next" title="Next">
          <svg><use href="#i-next" /></svg>
        </button>
        <span class="mini-time" id="mini-time">0:00</span>
      </div>

      <div class="mini-bar"><div class="mini-fill" id="mini-fill"></div></div>
    </div>

    <script src="theme.js"></script>
    <script src="mini.js"></script>
  </body>
</html>
