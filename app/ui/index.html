      <symbol id="i-mic" viewBox="0 0 24 24">
        <!-- A mic needs the cradle and stand to read as one. Earlier attempts
             drew a capsule on an angled stem, which at any proportion looks
             like a paintbrush. Tilted slightly so it is not a flat upright. -->
        <g transform="rotate(-14 12 12)">
          <rect x="9.1" y="2.2" width="5.8" height="10.4" rx="2.9"/>
          <path d="M6.6 10.8a5.4 5.4 0 0 0 10.8 0" stroke="currentColor"
                stroke-width="1.9" stroke-linecap="round" fill="none"/>
          <path d="M12 16.4v3.4M8.9 20.2h6.2" stroke="currentColor"
                stroke-width="1.9" stroke-linecap="round" fill="none"/>

    <div id="app">
      <!-- Custom titlebar: native decorations are off, so this provides the
           drag region and window buttons. -->
      <header id="titlebar">
        <div class="tb-left">
          <button class="icon-btn" id="btn-menu" title="Menu">
            <svg><use href="#i-dots" /></svg>
          </button>
          <button class="icon-btn" id="nav-back" title="Back" disabled>
            <svg><use href="#i-back" /></svg>
          </button>
          <button class="icon-btn" id="nav-fwd" title="Forward" disabled>
            <svg><use href="#i-fwd" /></svg>
          </button>
        </div>

        <div class="tb-center">
          <button class="home-btn" id="btn-home" title="Home">
            <svg><use href="#i-home" /></svg>
          </button>
          <div class="search-box">
            <svg class="mag"><use href="#i-search" /></svg>
            <input
              id="search-input"
              type="text"
              placeholder="What do you want to play?"
              spellcheck="false"
            />
            <span class="divider"></span>
            <button class="browse-btn" id="btn-browse" title="Browse">
              <svg><use href="#i-browse" /></svg>
            </button>
          </div>
        </div>

        <div class="tb-right">
          <button class="icon-btn" id="btn-stats" title="Listening stats">
            <svg><use href="#i-stats" /></svg>
          </button>
          <button class="icon-btn" id="btn-notices" title="What's new">
            <svg><use href="#i-bell" /></svg>
          </button>
          <button class="icon-btn" id="btn-jam" title="Jam">
            <svg><use href="#i-jam" /></svg>
          </button>
          <button class="avatar" id="btn-account" title="Account"></button>
          <span class="tb-sep"></span>
          <button class="winbtn" id="win-min" title="Minimise">
            <svg><use href="#i-min" /></svg>
          </button>
          <button class="winbtn" id="win-max" title="Maximise">
            <svg><use href="#i-max" /></svg>
          </button>
          <button class="winbtn close" id="win-close" title="Close">
            <svg><use href="#i-x" /></svg>
          </button>
        </div>
      </header>

      <div id="shell">
      <nav id="sidebar">
        <div class="gutter gutter-side" id="gutter-side" title="Drag to resize"></div>
        <div class="panel library">
          <div class="library-head">
            <svg><use href="#i-library" /></svg>
            <span>Your Library</span>
          </div>
          <div class="lib-filters">
            <button class="chip active" data-lib="playlists">Playlists</button>
            <button class="chip" data-lib="albums">Albums</button>
          </div>
          <div class="library-list" id="library-list"></div>
        </div>
      </nav>

      <main id="main" class="panel">
        <div id="offline" hidden class="offline-banner">
          Not connected to the playback daemon — reconnecting…
        </div>

        <div class="content" id="content"></div>
      </main>

      <aside id="rail" class="panel" hidden>
        <div class="gutter gutter-rail" id="gutter-rail" title="Drag to resize"></div>
        <div class="rail-tabs">
          <button class="rail-tab active" data-tab="queue">Queue</button>
          <button class="rail-tab" data-tab="recent">Recently played</button>
          <span class="spacer"></span>
          <button class="winbtn" id="rail-close" title="Hide">
            <svg><use href="#i-x" /></svg>
          </button>
        </div>
        <div class="rail-body" id="rail-body"></div>
      </aside>
      </div>

      <footer id="player">
        <div class="np" id="np"></div>

        <div class="controls">
          <div class="control-row">
            <button class="ctl" id="btn-shuffle" title="Shuffle">
              <svg><use href="#i-shuffle" /></svg>
            </button>
            <button class="ctl" id="btn-prev" title="Previous">
              <svg><use href="#i-prev" /></svg>
            </button>
            <button class="ctl ctl-play" id="btn-play" title="Play">
              <svg><use href="#i-play" /></svg>
            </button>
            <button class="ctl" id="btn-next" title="Next">
              <svg><use href="#i-next" /></svg>
            </button>
            <button class="ctl" id="btn-repeat" title="Repeat">
              <svg><use href="#i-repeat" /></svg>
            </button>
          </div>
          <div class="progress-row">
            <span class="time" id="time-now">0:00</span>
            <input id="seek" type="range" min="0" max="1000" value="0" />
            <span class="time" id="time-total">0:00</span>
          </div>
        </div>

        <div class="right-controls">
          <button class="ctl" id="btn-lyrics" title="Lyrics">
            <svg><use href="#i-mic" /></svg>
          </button>
          <button class="ctl" id="btn-queue" title="Queue">
            <svg><use href="#i-queue" /></svg>
          </button>
          <button class="ctl" id="btn-devices" title="Connect to a device">
            <svg><use href="#i-devices" /></svg>
          </button>
          <button class="ctl" id="btn-mute" title="Mute">
            <svg><use href="#i-volume" /></svg>
          </button>
          <input id="volume" class="volume" type="range" min="0" max="65535" value="32768" />
        </div>
      </footer>

      <div id="popovers"></div>
    <div id="ctxmenu" hidden></div>
      <div id="toasts"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
