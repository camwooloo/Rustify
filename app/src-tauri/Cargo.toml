[package]
name = "spotify-rust-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rustify"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
spotify-proto.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"

# Everything here is used by code that builds on every platform. These lived
# under the Windows target until macOS and Linux tried to compile: only the
# `windows` crate below is actually Windows-only.
tokio.workspace = true
reqwest = { version = "0.12", default-features = false, features = [
    "native-tls",
    "json",
] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Media",
    "Foundation",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
    # Taskbar thumbnail toolbar: the shell interface, the window subclass that
    # receives its clicks, and the GDI calls that build its icons.
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
